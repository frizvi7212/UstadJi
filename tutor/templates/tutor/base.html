<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustadji</title>
    <style>
      body {
        background-color: #1a1a1a;
        color: #e8e8e8;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

      textarea {
        width: 100%;
        box-sizing: border-box;
        background-color: #2a2a2a;
        color: #e8e8e8;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px;
        font-family: inherit;
        font-size: 15px;
      }

      button {
        background-color: #3a3a3a;
        color: #e8e8e8;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 8px 16px;
        margin-top: 8px;
        cursor: pointer;
      }

      button:hover {
        background-color: #4a4a4a;
      }

      p {
        line-height: 1.5;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 12px;
        margin-bottom: 16px;
        border-bottom: 1px solid #333;
      }

      .hamburger {
        font-size: 22px;
        cursor: pointer;
      }

      .topbar-title {
        font-weight: 500;
        font-size: 16px;
      }
      .action-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }

      .action-bar form {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="hamburger">&#9776;</span>
      <span class="topbar-title">Ustadji</span>
    </div>
    {% block content %}
    <div class="action-bar">
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
      <a href="{% url 'new_conversation' %}">New Conversation</a>
    </div>
    {% endblock %}
  </body>
</html>
