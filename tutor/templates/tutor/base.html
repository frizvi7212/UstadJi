<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustadji</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #1a1a1a;
        color: #e8e8e8;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
        padding-bottom: 80px;
      }

      textarea {
        width: 100%;
        box-sizing: border-box;
        background-color: #2a2a2a;
        color: #e8e8e8;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px;
        font-family: inherit;
        font-size: 15px;
      }

      button {
        background-color: #3a3a3a;
        color: #e8e8e8;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 8px 16px;
        margin-top: 8px;
        cursor: pointer;
      }

      button:hover {
        background-color: #4a4a4a;
      }

      p {
        line-height: 1.5;
      }
      .topbar {
        position: fixed;
        top: 16px;
        left: 25px;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 100;
      }

      .hamburger {
        font-size: 22px;
        cursor: pointer;
      }

      .topbar-title {
        font-weight: 500;
        font-size: 20px;
        color: #b15b7a;
        padding-top: 13px;
      }
      .action-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }

      .action-bar form {
        margin: 0;
      }
      .floating-actions {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 100;
      }

      .icon-form {
        margin: 0;
      }

      .icon-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        color: #e8e8e8;
        font-size: 18px;
        text-decoration: none;
        cursor: pointer;
      }

      .new_convo {
        background-color: #3a3a3a;
        color: #e8e8e8;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 0px;
        margin-top: 8px;
      }
      .icon-button:hover {
        border-radius: 10px;
        background-color: #3a3a3a;
      }
      .hamburger-btn {
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 22px;
        padding: 0;
        cursor: pointer;
      }
      .input-bar {
        position: fixed;
        bottom: 0;
        left: 18.75rem;
        right: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background-color: #1a1a1a;
        border-top: 1px solid #333;
        width: 60%;
        border-radius: 0.938rem;
      }

      .input-bar textarea {
        flex: 1;
        resize: none;
        max-height: 120px;
      }

      .send-icon-btn {
        background: transparent;
        border: none;
        color: #b15b7a;
        font-size: 20px;
        cursor: pointer;
        padding: 8px;
      }
      .offcanvas a {
        color: #e8e8e8;
      }
      .user-message {
        background-color: #1a1a1a;
        margin-left: auto;
        text-align: right;
        padding: 10px;
      }

      .assistant-message {
        background-color: #b15b7a;
        padding: 10px;
        margin-right: auto;
        text-align: left;
        border-radius: 10px;
        justify-content: left;
      }
      @media (max-width: 600px) {
        .input-bar {
          left: 0;
          width: 100%;
          border-radius: 0;
        }
      }
      @media (max-width: 400px) {
        .topbar-title {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button
        class="btn hamburger-btn"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#conversationSidebar"
        aria-controls="conversationSidebar"
      >
        &#9776;
      </button>
      <span class="topbar-title">Ustadji</span>
    </div>
    {% block content %}
    <div class="action-bar">
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
      <a href="{% url 'new_conversation' %}">New Conversation</a>
    </div>
    {% endblock %}
    <script>
      const textarea = document.getElementById("code_submit");

      if (textarea) {
        textarea.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            event.target.form.submit();
          }
        });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
