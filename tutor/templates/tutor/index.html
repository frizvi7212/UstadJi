<form method="post">
  {% csrf_token %}
  <textarea name="code" placeholder="Paste your buggy code"></textarea>
  <button type="submit">Ask Ustadji</button>
</form>

{% for code in messages %} {% if code.role == "user" %}
<p>You: {{ code.content }}</p>
{% endif %} {% if code.role == "assistant" %}
<p>Ustadji: {{ code.content }}</p>
{% endif %} {% endfor %}
