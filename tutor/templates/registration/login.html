{% extends 'tutor/base.html' %}{% block content %}
<form method="post">
  {% csrf_token %}
  <label>Username:</label>{{ form.username }} {{ form.username.errors }}
  <label>Password:</label>{{ form.password }} {{ form.password.errors }}
  <button type="submit">Login</button>
  {{ form.non_field_errors }}
  <a href="{% url 'signup' %}">signup</a>
</form>

{% endblock %}
